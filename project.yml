name: Kekkai
options:
  bundleIdPrefix: com.mostlygino
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    # Your Apple Developer team ID. Required for signing, and the app and
    # extension refuse to talk to each other without it.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kekkai:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostlygino.Kekkai
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Development, Beta or Release. scripts/release.sh sets it; local builds stay Development.
        KEKKAI_CHANNEL: Development
        # Set by scripts/install.sh and scripts/release.sh; plain Xcode builds say "unknown".
        KEKKAI_COMMIT: unknown
        KEKKAI_BUILD_DATE: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kekkai
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KekkaiChannel: $(KEKKAI_CHANNEL)
        KekkaiCommit: $(KEKKAI_COMMIT)
        KekkaiBuildDate: $(KEKKAI_BUILD_DATE)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        KekkaiTeamID: $(DEVELOPMENT_TEAM)
    entitlements:
      path: App/Kekkai.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
        com.apple.developer.system-extension.install: true
    dependencies:
      - target: KekkaiFilter
  KekkaiFilter:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostlygino.Kekkai.Filter
        PRODUCT_NAME: com.mostlygino.Kekkai.Filter
        PRODUCT_MODULE_NAME: KekkaiFilter
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Kekkai Filter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSystemExtensionUsageDescription: Kekkai inspects network connections so it can show and block them.
        KekkaiTeamID: $(DEVELOPMENT_TEAM)
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)com.mostlygino.Kekkai.xpc
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    entitlements:
      path: Extension/KekkaiFilter.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.mostlygino.Kekkai
