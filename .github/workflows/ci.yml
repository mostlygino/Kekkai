name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only on the public repo: macOS minutes count ten times against a private repo's allowance.
    if: ${{ !github.event.repository.private }}
    # Kekkai targets macOS 26, so it needs a runner with Xcode 26 or later.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Logic checks
        run: scripts/check.sh
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build app and extension (unsigned)
        run: |
          xcodebuild -project Kekkai.xcodeproj -scheme Kekkai -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
